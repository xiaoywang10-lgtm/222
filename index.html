<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#161b1e">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="masthead">
        <p class="eyebrow">ARCADE / 01</p>
        <h1>TETRIS</h1>
      </header>

      <section class="game-layout" aria-label="Tetris game">
        <div class="board-wrap">
          <canvas id="game-canvas" width="300" height="600" aria-label="Tetris game board"></canvas>
          <p id="status-message" class="status-message" aria-live="polite">Press start to play</p>
        </div>

        <aside class="side-panel" aria-label="Game information">
          <section class="next-piece" aria-label="Next piece">
            <p class="panel-label">NEXT</p>
            <canvas id="next-canvas" width="120" height="100" aria-label="Next Tetris piece"></canvas>
          </section>

          <dl class="stats" aria-label="Game score">
            <div><dt>SCORE</dt><dd id="score">0</dd></div>
            <div><dt>LEVEL</dt><dd id="level">1</dd></div>
            <div><dt>LINES</dt><dd id="lines">0</dd></div>
          </dl>

          <fieldset class="difficulty-picker">
            <legend>DIFFICULTY</legend>
            <div class="difficulty-options" role="radiogroup" aria-label="Game difficulty">
              <label><input type="radio" name="difficulty" value="easy"> Easy</label>
              <label><input type="radio" name="difficulty" value="standard" checked> Standard</label>
              <label><input type="radio" name="difficulty" value="hard"> Hard</label>
            </div>
          </fieldset>

          <div class="commands">
            <button id="start-button" class="primary-button" type="button">Start game</button>
            <button id="pause-button" class="secondary-button" type="button" disabled>Pause</button>
          </div>
        </aside>
      </section>

      <nav class="touch-controls" aria-label="Game controls">
        <button type="button" data-action="left" aria-label="Move left" title="Move left">&#8592;</button>
        <button type="button" data-action="rotate" aria-label="Rotate piece" title="Rotate piece">&#8635;</button>
        <button type="button" data-action="right" aria-label="Move right" title="Move right">&#8594;</button>
        <button type="button" data-action="down" aria-label="Move down" title="Move down">&#8595;</button>
        <button type="button" data-action="drop" aria-label="Hard drop" title="Hard drop">&#8659;</button>
      </nav>

      <footer class="keyboard-hint">Arrow keys to move &middot; Up to rotate &middot; Space to drop &middot; P to pause</footer>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
